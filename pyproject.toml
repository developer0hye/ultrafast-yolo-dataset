[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ultrafast-yolo-dataset"
version = "0.1.0a1"
description = "Batched native YOLO annotation parsing and compact storage"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]
license = "AGPL-3.0-or-later"

[tool.maturin]
python-source = "python"
module-name = "ultrafast_yolo_dataset._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
