name: Wheel compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_artifact:
        description: Existing dataset artifact ID to inspect instead of building wheels
        type: string
        default: ''
      inspect_run:
        description: Run ID that must own the artifact
        type: string
        default: ''
      sdist_only:
        description: Validate a source-only wheel rebuild on Linux Python 3.12
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sdist-rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.sdist_only && inputs.inspect_artifact == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      OMP_NUM_THREADS: '1'
      YOLO_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install source build dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          python -m pip install build==1.3.0 maturin==1.15.0 numpy==2.4.4 pillow==12.1.1
          rustc -vV
      - name: Build and inspect source distribution
        id: unpack
        run: |
          mkdir sdist-evidence
          git rev-parse HEAD > sdist-evidence/source-commit.txt
          python -m build --sdist --no-isolation
          python bench/inspect_sdist.py --checkout . --archive dist/ultrafast_yolo_dataset-0.1.0a1.tar.gz --destination "$RUNNER_TEMP/sdist-rebuild" --report sdist-evidence/source-inspection.json
      - name: Build wheel using only unpacked source
        working-directory: ${{ steps.unpack.outputs.source }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sdist-cargo-target
        run: python -m build --wheel --no-isolation
      - name: Create clean installed runtime
        run: |
          python -m venv "$RUNNER_TEMP/sdist-runtime"
          echo "$RUNNER_TEMP/sdist-runtime/bin" >> "$GITHUB_PATH"
      - name: Audit installed source-built wheel and run core tests
        working-directory: ${{ steps.unpack.outputs.source }}
        run: |
          python -m pip install numpy==2.4.4 pillow==12.1.1 pytest==9.1.1
          python -m pip install --no-deps dist/*.whl
          python bench/ci_wheel_check.py
          python bench/wheel_smoke.py --out dist/standalone-cache-smoke.json
          python -m pytest -q tests/test_parser.py tests/test_snapshot_hashes.py tests/test_materialize.py tests/test_benchmark_fixture.py tests/test_cache_section_buffers.py --junitxml=dist/core-tests.xml
          python -m pip freeze > dist/final-environment.txt
      - name: Collect source rebuild artifacts
        if: always()
        env:
          SDIST_SOURCE: ${{ steps.unpack.outputs.source }}
        run: |
          mkdir -p sdist-evidence
          if [ -n "$SDIST_SOURCE" ] && [ -d "$SDIST_SOURCE/dist" ]; then
            cp -a "$SDIST_SOURCE/dist" sdist-evidence/rebuilt
          fi
      - name: Preserve source rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist-rebuild
          path: sdist-evidence/
          if-no-files-found: error
          retention-days: 14
  inspect-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect original archive and retain small receipts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.inspect_artifact }}
          RUN_ID: ${{ inputs.inspect_run }}
        run: python bench/inspect_hosted_artifact.py --repository "$REPOSITORY" --artifact-id "$ARTIFACT_ID" --run-id "$RUN_ID" --out artifact-inspection
      - name: Preserve artifact inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-inspection
          path: artifact-inspection/
          if-no-files-found: error
          retention-days: 14
  wheel:
    if: github.event_name != 'workflow_dispatch' || (inputs.inspect_artifact == '' && !inputs.sdist_only)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      OMP_NUM_THREADS: '1'
      YOLO_OFFLINE: 'true'
      NUMPY_VERSION: ${{ matrix.python == '3.10' && '2.2.6' || '2.4.4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustc -vV
          python - <<'PY'
          import subprocess
          from pathlib import Path
          sysroot = Path(subprocess.check_output(['rustc', '--print', 'sysroot'], text=True).strip())
          supplied = sysroot / 'share/doc/rust/COPYRIGHT-library.html'
          bundled = Path('python/ultrafast_yolo_dataset/licenses/rust-stdlib/1.98.0/COPYRIGHT-library.html')
          assert supplied.read_bytes() == bundled.read_bytes(), 'refresh notices for this toolchain/platform'
          PY
          python -m pip install build==1.3.0 maturin==1.15.0 "numpy==$NUMPY_VERSION" pillow==12.1.1
          python -c "import platform; assert platform.machine().lower() in ('arm64', 'aarch64') if platform.system() == 'Darwin' else platform.machine().lower() in ('amd64', 'x86_64')"
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist --no-isolation
      - name: Create isolated runtime environment
        run: |
          python -m venv wheel-env
          python - <<'PY'
          import os
          from pathlib import Path
          scripts = (Path('wheel-env') / ('Scripts' if os.name == 'nt' else 'bin')).resolve()
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(scripts) + '\n')
          PY
      - name: Install and audit wheel
        run: |
          python -m pip install "numpy==$NUMPY_VERSION" pillow==12.1.1
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python bench/ci_wheel_check.py
          python bench/wheel_smoke.py --out dist/standalone-cache-smoke.json
      - name: Core parser, hashing and materialization
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q tests/test_parser.py tests/test_snapshot_hashes.py tests/test_materialize.py tests/test_benchmark_fixture.py tests/test_cache_section_buffers.py --junitxml=dist/core-tests.xml
      - name: CPU Torch dependencies
        if: matrix.python != '3.10' && runner.os != 'macOS'
        run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: macOS Torch dependencies
        if: matrix.python != '3.10' && runner.os == 'macOS'
        run: python -m pip install torch==2.10.0 torchvision==0.25.0
      - name: Pinned framework integration and cache tests
        if: matrix.python != '3.10'
        run: |
          python -m pip install numpy==2.4.4 pillow==12.1.1 opencv-python==4.13.0.92 pi-heif==1.4.0 https://github.com/ultralytics/ultralytics/archive/795a556942a12fe0124cf767888194a1d0b83e2e.tar.gz
          python -m pytest -q tests/test_scan.py tests/test_cache.py tests/test_integration.py --junitxml=dist/integration-tests.xml
      - name: Record final Python environment
        if: always()
        run: |
          mkdir -p dist
          python -m pip freeze > dist/final-environment.txt
      - name: Preserve all artifacts and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
